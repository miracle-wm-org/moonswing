name: Nightly Snap
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: snapcore/action-build@v1
      - uses: actions/upload-artifact@v4
        with:
          name: graceful-shell-snap
          path: ${{ steps.build.outputs.snap }}
      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          files: ${{ steps.build.outputs.snap }}
          body: |
            Automated nightly classic snap built from the latest `main`.
            Install: `sudo snap install ./graceful-shell_*.snap --classic --dangerous`
