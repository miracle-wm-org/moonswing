name: Website

# The site is built from CONFIG.md and assets/ as well as website/, so a change
# to either has to redeploy it.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'CONFIG.md'
      - 'assets/*.svg'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'CONFIG.md'
      - 'assets/*.svg'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      # `build` runs the sync step first, which fails if CONFIG.md has grown a
      # section no page claims.
      - run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  # Pull requests build but do not deploy: the artifact is the check.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
