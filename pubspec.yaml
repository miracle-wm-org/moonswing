name: graceful_shell
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  # dart:ffi NativeCallable (monitor_watcher, lock/pam_authenticator) needs 3.1.0.
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter
  miracle:
    git:
      url: https://github.com/miracle-wm-org/miracle.dart.git
  wayland:
    git:
      url: https://github.com/robert-ancell/wayland.dart.git
  layer_shell:
    git:
      url: https://github.com/mattkae/layer_shell.dart.git
  ext_session_lock:
    path: packages/ext_session_lock
  http: ^1.2.0
  crypto: ^3.0.3
  udev: ^0.0.3
  dbus: ^0.7.11
  font_awesome_flutter: ^11.0.0
  pulseaudio: ^0.0.8
  ffi: ^2.1.3
  toml: ^0.18.0
  xdg_icons: ^0.1.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_linux: ^1.0.4
  ubuntu_session: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
