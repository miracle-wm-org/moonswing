name: moonswing
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  # dart:ffi NativeCallable (monitor_watcher, lock/pam_authenticator) needs 3.1.0;
  # math_expressions 3.2 (the launcher's calculator) raised the floor to 3.8;
  # timezone 0.11 (the calendar's world clocks) raised it again to 3.10;
  # weather_icons_animated 0.0.2 (the Meteocons set) raises it to 3.11.4.
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  miracle:
    git:
      url: https://github.com/miracle-wm-org/miracle.dart.git
  wayland:
    git:
      url: https://github.com/robert-ancell/wayland.dart.git
  layer_shell:
    git:
      url: https://github.com/mattkae/layer_shell.dart.git
  ext_session_lock:
    path: packages/ext_session_lock
  http: ^1.2.0
  # SHA-256 for the Google sign-in's PKCE challenge (RFC 7636 S256).
  crypto: ^3.0.6
  udev: ^0.0.3
  dbus: ^0.7.11
  font_awesome_flutter: ^11.0.0
  # The weather icons: Meteocons (basmilius/weather-icons), bundled as SVG and
  # Lottie. It is the WMO table's own granularity and then some — steady rain
  # and showers are different pictures, as are a thunderstorm and a severe one
  # — which is what `lib/weather/weather_condition.dart` already resolves and
  # had nowhere to put. It replaced Material Symbols, which replaced emoji.
  #
  # Two things worth knowing before adding to it. Assets are not tree-shaken the
  # way an icon *font* is, so all 236 icons in all seven variants ship whether
  # or not the shell names them — about 9MB into the bundle and the snap. And
  # the shell reaches for exactly one of those variants' formats, `svg-static`:
  # `lib/weather/weather_icons.dart` animates nothing, so the pack's Lottie
  # files are unreachable from it and the `lottie` dependency that used to sit
  # here for one `FrameRate` constant went with the animation. (`svgAnimated`
  # would not have moved anyway — `flutter_svg` drops the SMIL the animated
  # SVGs carry their motion in, so it is a still frame that merely costs more
  # to parse than `svgStatic` does.)
  #
  # `weather_icons` (the Erik Flowers pack) is the obvious alternative and is
  # unusable: it pins `sdk: <3.0.0` and was last published in 2021.
  weather_icons_animated: ^0.0.2
  # Interface chrome, not weather: the chevrons and the place marker in the
  # settings location row (`overlay/settings/shell/weather_location.dart`).
  # Meteocons is a weather set and has no map pin.
  material_symbols_icons: ^4.2960.0
  # Two callers, one of them the reason this is a `dependencies` entry rather
  # than a `dev_dependencies` one. `weather_icons_animated` renders the
  # Meteocons through it and does not re-export it, so
  # `test/weather_icons_test.dart` names `SvgAssetLoader` to pin which of the
  # pack's seven variants each of `WeatherIcon`'s three renderings reaches for;
  # that alone kept it a test-only dependency. `lib/tux/tux_art.dart` now names
  # `SvgPicture.string` — Tux is an SVG *string constant*, embedded the way
  # `theme/builtin_themes.dart` embeds the shipped palettes, so this stays true
  # of the shell: there is no `assets:` section, and nothing here is a file the
  # Makefile or the snap has to install.
  flutter_svg: ^2.2.0
  # The loading indicators. `SpinKitRing` is what `LoadingIndicator`
  # (lib/loading_indicator.dart) renders, and that widget is the only thing in
  # the shell that shows an operation is in flight — see the comment there for
  # why there is exactly one of them.
  flutter_spinkit: ^5.2.2
  pulseaudio: ^0.0.8
  ffi: ^2.1.3
  # SQLite, for the todo board and notes (lib/todo/todo_database.dart). Its
  # build hook downloads a prebuilt, hash-checked libsqlite3 (FTS5 compiled in)
  # into the bundle, which is loaded by path: the snap runs its own copy, never
  # whatever the host has or lacks. The board's trigram index needs 3.34+,
  # newer than some hosts still in support.
  sqlite3: ^3.6.0
  toml: ^0.18.0
  # 3.2.0 is the only line compatible with toml's petitparser ^7; the 3.0.x
  # line pins petitparser ^6. It is also what raises the SDK floor above.
  math_expressions: ^3.2.0
  xdg_icons: ^0.1.2
  # The IANA time zone database, for the calendar tab's world clocks. Unlike
  # `intl` — which month.dart deliberately refuses — this is data, not
  # formatting machinery, and DST transition tables cannot be hand-rolled.
  # `package:timezone/data/latest.dart` embeds the db as a Dart byte literal,
  # so there is no asset bundle and no binding to initialise.
  timezone: ^0.11.1
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_linux: ^1.0.4
  ubuntu_session: ^0.0.4
  # Flutter's generative-UI framework, behind the Claude module's "build me a
  # UI" answers (lib/claude/). The shell uses its A2UI engine — the message
  # parser, the surface controller, the data model and the `Surface` widget —
  # and none of its widgets: every component Claude can ask for is drawn by the
  # shell's own catalogue (lib/claude/claude_catalog.dart) in the theme's
  # palette, because genui's basic catalogue is Material and this shell has
  # none. Its audio item is why `audioplayers_linux` is overridden below.
  genui: ^0.10.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # test/wl_interfaces_test.dart diffs the hand-written Wayland interface
  # tables against the protocol XMLs in protocol/.
  xml: ^6.5.0

# genui depends on `audioplayers` for one catalogue item (an audio player) the
# shell never offers Claude, and `audioplayers_linux` is a native plugin that
# links GStreamer. Left alone it would make `libgstreamer1.0-dev` a build
# dependency and GStreamer a DT_NEEDED of the bundle — one more library the snap
# would have to decide whether to stage — for a widget that can never be
# rendered. The stand-in has the same name and version and no plugin, so
# nothing is compiled and nothing is linked. Drop it the day genui stops
# depending on audioplayers.
dependency_overrides:
  audioplayers_linux:
    path: packages/audioplayers_linux_none

flutter:
  uses-material-design: true
