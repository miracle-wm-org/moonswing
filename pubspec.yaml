name: graceful_shell
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  # dart:ffi NativeCallable (monitor_watcher, lock/pam_authenticator) needs 3.1.0;
  # math_expressions 3.2 (the launcher's calculator) raised the floor to 3.8;
  # timezone 0.11 (the calendar's world clocks) raised it again to 3.10;
  # weather_icons_animated 0.0.2 (the Meteocons set) raises it to 3.11.4.
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  miracle:
    git:
      url: https://github.com/miracle-wm-org/miracle.dart.git
  wayland:
    git:
      url: https://github.com/robert-ancell/wayland.dart.git
  layer_shell:
    git:
      url: https://github.com/mattkae/layer_shell.dart.git
  ext_session_lock:
    path: packages/ext_session_lock
  http: ^1.2.0
  udev: ^0.0.3
  dbus: ^0.7.11
  font_awesome_flutter: ^11.0.0
  # The weather icons: Meteocons (basmilius/weather-icons), bundled as SVG and
  # Lottie. It is the WMO table's own granularity and then some — steady rain
  # and showers are different pictures, as are a thunderstorm and a severe one
  # — which is what `lib/weather/weather_condition.dart` already resolves and
  # had nowhere to put. It replaced Material Symbols, which replaced emoji.
  #
  # Two costs worth knowing before adding to it. Assets are not tree-shaken the
  # way an icon *font* is, so all 236 icons in all seven variants ship whether
  # or not the shell names them — about 9MB into the bundle and the snap. And
  # `flutter_svg` drops the SMIL animation the animated SVGs carry their motion
  # in, so `svgAnimated` is a still frame that costs more to parse than
  # `svgStatic`: see `lib/weather/weather_icons.dart`, which reaches for Lottie
  # or for nothing.
  #
  # `weather_icons` (the Erik Flowers pack) is the obvious alternative and is
  # unusable: it pins `sdk: <3.0.0` and was last published in 2021.
  weather_icons_animated: ^0.0.2
  # A direct dependency for one type: `FrameRate`, which caps the Lottie icons
  # below the display's rate. `weather_icons_animated` takes it as a parameter
  # but does not re-export it, and an uncapped animation on the desktop surface
  # would contradict `weather_sky.dart`'s own 30fps cap in the same card.
  lottie: ^3.3.2
  # Interface chrome, not weather: the chevrons and the place marker in the
  # settings location row (`overlay/settings/shell/weather_location.dart`).
  # Meteocons is a weather set and has no map pin.
  material_symbols_icons: ^4.2960.0
  # The loading indicators. `SpinKitRing` is what `LoadingIndicator`
  # (lib/loading_indicator.dart) renders, and that widget is the only thing in
  # the shell that shows an operation is in flight — see the comment there for
  # why there is exactly one of them.
  flutter_spinkit: ^5.2.2
  pulseaudio: ^0.0.8
  ffi: ^2.1.3
  toml: ^0.18.0
  # 3.2.0 is the only line compatible with toml's petitparser ^7; the 3.0.x
  # line pins petitparser ^6. It is also what raises the SDK floor above.
  math_expressions: ^3.2.0
  xdg_icons: ^0.1.2
  # The IANA time zone database, for the calendar tab's world clocks. Unlike
  # `intl` — which month.dart deliberately refuses — this is data, not
  # formatting machinery, and DST transition tables cannot be hand-rolled.
  # `package:timezone/data/latest.dart` embeds the db as a Dart byte literal,
  # so there is no asset bundle and no binding to initialise.
  timezone: ^0.11.1
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_linux: ^1.0.4
  ubuntu_session: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # `weather_icons_animated` renders through this and does not re-export it;
  # `test/weather_icons_test.dart` names `SvgAssetLoader` to pin which of the
  # pack's seven variants each of `WeatherIcon`'s three renderings reaches for,
  # which is otherwise a rule that lives only in a comment. Not a `dependencies`
  # entry: nothing under `lib/` names it.
  flutter_svg: ^2.2.0
  # test/wl_interfaces_test.dart diffs the hand-written Wayland interface
  # tables against the protocol XMLs in protocol/.
  xml: ^6.5.0

flutter:
  uses-material-design: true
