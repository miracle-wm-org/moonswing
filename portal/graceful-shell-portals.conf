# Routes the ScreenCast portal to graceful-shell's own backend, so screen
# sharing uses the shell's monitor/window picker.
#
# Installed under the names miracle-wm-portals.conf and mir-portals.conf, from
# XDG_CURRENT_DESKTOP=miracle-wm:mir, which miracle-wm's session setup exports.
# Both, because which of the two xdg-desktop-portal reaches first follows that
# list's order. A desktop-specific file is consulted before the generic
# portals.conf beside it, so any pre-existing preference (e.g. an
# xdg-desktop-portal-wlr setup) is left untouched but out-ranked.
#
# ~/.config/xdg-desktop-portal/ is where `make install-portal` and the snap's
# launcher put it. The snap also drops a copy in
# /usr/share/xdg-desktop-portal/ from its install hook — the lowest-precedence
# location, so that copy is a machine default rather than an override.
[preferred]
org.freedesktop.impl.portal.ScreenCast=graceful-shell
