# Routes the ScreenCast portal to graceful-shell's own backend, so screen
# sharing uses the shell's monitor/window picker.
#
# Installed as ~/.config/xdg-desktop-portal/mir-portals.conf. That
# desktop-specific file is consulted before the generic portals.conf beside
# it, so any pre-existing preference (e.g. an xdg-desktop-portal-wlr setup)
# is left untouched but out-ranked. The desktop name comes from
# XDG_CURRENT_DESKTOP=mir:miracle-wm, which miracle-wm's session setup
# exports.
[preferred]
org.freedesktop.impl.portal.ScreenCast=graceful-shell
