site_name: Graceful Shell
site_description: The shell of your dreams, built with Flutter.
site_url: https://miracle-wm-org.github.io/graceful-shell/
repo_url: https://github.com/miracle-wm-org/graceful-shell
repo_name: miracle-wm-org/graceful-shell

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration:
    - Overview: configuration/index.md
    - Panels & Layout: configuration/panels.md
    - Modules: configuration/modules.md
    - Theme: configuration/theme.md
    - Background: configuration/background.md
    - Full Example: configuration/example.md
