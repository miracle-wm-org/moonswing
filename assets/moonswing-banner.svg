    lean -14deg   ropes +-4   seat y26
    hip 0.2,25.3  knee 5.8,25  ankle 9.6,27.4  toe 10.9,27.2  shoulder -0.5,17.5  elbow 2.3,14.8  hand 4,11  head -0.6,12.85
  -->
  <defs>
