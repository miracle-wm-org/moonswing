<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"
     role="img" aria-label="A hooded runner in the graceful outfit vaulting between two desktop windows, under a shell panel">
  <defs>
    <linearGradient id="ga-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0e1d"/>
      <stop offset="55%" stop-color="#1a0812"/>
      <stop offset="1" stop-color="#100510"/>
    </linearGradient>
    <linearGradient id="ga-cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fbc"/>
      <stop offset="1" stop-color="#d8477f"/>
    </linearGradient>
    <linearGradient id="ga-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1729" stop-opacity=".95"/>
      <stop offset="1" stop-color="#240c1a" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="ga-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ff6fa8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff6fa8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="420" fill="url(#ga-sky)"/>
  <rect width="960" height="420" fill="url(#ga-glow)"/>

  <!-- faint starfield -->
  <g fill="#ffd9e8" fill-opacity=".18">
    <circle cx="96" cy="72" r="1.6"/><circle cx="212" cy="46" r="1.1"/><circle cx="330" cy="96" r="1.4"/>
    <circle cx="628" cy="58" r="1.2"/><circle cx="742" cy="104" r="1.7"/><circle cx="884" cy="64" r="1.3"/>
    <circle cx="452" cy="40" r="1"/><circle cx="806" cy="176" r="1.2"/><circle cx="150" cy="168" r="1.1"/>
  </g>

  <!-- the shell's own panel, across the top -->
  <rect x="0" y="0" width="960" height="26" fill="#1c0812" fill-opacity=".92"/>
  <g fill="#e9639a" fill-opacity=".55">
    <rect x="24" y="10" width="26" height="6" rx="3"/>
    <rect x="58" y="10" width="12" height="6" rx="3" fill-opacity=".3"/>
    <rect x="78" y="10" width="12" height="6" rx="3" fill-opacity=".3"/>
    <rect x="432" y="10" width="52" height="6" rx="3" fill-opacity=".4"/>
    <rect x="806" y="10" width="18" height="6" rx="3"/>
    <rect x="832" y="10" width="18" height="6" rx="3"/>
    <rect x="858" y="10" width="42" height="6" rx="3"/>
  </g>
  <rect x="0" y="26" width="960" height="1" fill="#e9639a" fill-opacity=".22"/>

  <!-- the obstacles: two windows with a gap between them -->
  <g>
    <rect x="70" y="236" width="290" height="150" rx="14" fill="url(#ga-win)"
          stroke="#e9639a" stroke-opacity=".28" stroke-width="1.5"/>
    <rect x="70" y="236" width="290" height="30" rx="14" fill="#e9639a" fill-opacity=".12"/>
    <rect x="70" y="252" width="290" height="14" fill="#e9639a" fill-opacity=".12"/>
    <g fill="#ff9ec6" fill-opacity=".5">
      <circle cx="92" cy="251" r="4"/><circle cx="108" cy="251" r="4"/><circle cx="124" cy="251" r="4"/>
    </g>
    <g fill="#ffd9e8" fill-opacity=".13">
      <rect x="94" y="292" width="180" height="9" rx="4.5"/>
      <rect x="94" y="314" width="230" height="9" rx="4.5"/>
      <rect x="94" y="336" width="140" height="9" rx="4.5"/>
    </g>
  </g>
  <g>
    <rect x="600" y="286" width="290" height="112" rx="14" fill="url(#ga-win)"
          stroke="#e9639a" stroke-opacity=".28" stroke-width="1.5"/>
    <rect x="600" y="286" width="290" height="30" rx="14" fill="#e9639a" fill-opacity=".12"/>
    <rect x="600" y="302" width="290" height="14" fill="#e9639a" fill-opacity=".12"/>
    <g fill="#ff9ec6" fill-opacity=".5">
      <circle cx="622" cy="301" r="4"/><circle cx="638" cy="301" r="4"/><circle cx="654" cy="301" r="4"/>
    </g>
    <g fill="#ffd9e8" fill-opacity=".13">
      <rect x="624" y="342" width="200" height="9" rx="4.5"/>
      <rect x="624" y="364" width="150" height="9" rx="4.5"/>
    </g>
  </g>

  <!-- the leap -->
  <path d="M330 244 C420 132 560 132 656 246" fill="none" stroke="#ff9ec6" stroke-opacity=".3"
        stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- the runner, mid-vault -->
  <g transform="translate(370 92) scale(4.6)">
    <path d="M36 25 C25 27 15 34 9 48 C20 40 29 37 37 36 Z" fill="#ab2a61"/>
    <g stroke="url(#ga-cloth)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M36 25 L27 28 L20 25"/>
      <path d="M27 37 L16 42 L11 34"/>
      <path d="M38 23 L27 37"/>
      <path d="M27 37 L37 40 L43 50"/>
      <path d="M37 24 L46 21 L52 26"/>
    </g>
    <path d="M46 12 C41 7 33 9 31 16 C29 21 31 26 35 26 L39 23 C36 18 40 13 46 12 Z" fill="#8c1e4c"/>
    <circle cx="40" cy="17" r="5.4" fill="url(#ga-cloth)"/>
    <path d="M46 12 C41 11 37 14 36 18 C35 22 37 25 40 25 L41 21 C39 17 41 13 46 12 Z" fill="#e2679c"/>
  </g>
</svg>
