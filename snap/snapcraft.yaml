name: graceful-shell
base: core22
version: '0.1-nightly'
summary: The shell of your dreams, built with Flutter
description: |
  Graceful Shell renders Wayland layer-shell panels (taskbars) and an optional
  wallpaper for Wayland compositors such as Miracle WM, built with Flutter.
grade: devel
confinement: classic
platforms:
  amd64:

apps:
  graceful-shell:
    command: graceful_shell
    environment:
      # Classic confinement runs in the host namespace and does not set up a
      # library search path. Point the loader at the staged libs (libmpv.so.1
      # and its deps live under usr/lib/<triplet>; Flutter plugins in lib).
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$SNAP/lib:$LD_LIBRARY_PATH

parts:
  graceful-shell:
    plugin: flutter
    source: .
    flutter-target: lib/main.dart
    flutter-channel: master
    override-build: |
      if [ ! -d "${CRAFT_PART_BUILD}/flutter-distro" ]; then
        # Full clone (not --depth 1): Flutter derives its SDK version from
        # `git describe --tags`, which needs tag history. A shallow master
        # clone reports version 0.0.0-unknown and fails pub SDK constraints.
        git clone -b master \
          https://github.com/flutter/flutter.git "${CRAFT_PART_BUILD}/flutter-distro"
      fi
      flutter config --enable-windowing
      craftctl default
    build-packages:
      - libgtk-3-dev
      - libgtk-layer-shell-dev
      - libasound2-dev
      - libmpv-dev
      - pkg-config
    stage-packages:
      - libgtk-layer-shell0
      - libmpv1
      - libasound2
      - libpulse0
    prime:
      # Classic confinement uses the host graphics stack. Bundled Mesa
      # (pulled in transitively by libmpv/gtk) is a different version than the
      # host DRI drivers, causing "libEGL fatal: did not find extension
      # DRI_Mesa version 1". Drop the whole GL/EGL/GBM/DRI set so the loader
      # falls through to the host's consistent Mesa + drivers.
      - -usr/lib/*/libEGL*
      - -usr/lib/*/libGL.so*
      - -usr/lib/*/libGLX*
      - -usr/lib/*/libGLdispatch*
      - -usr/lib/*/libOpenGL*
      - -usr/lib/*/libGLES*
      - -usr/lib/*/libgbm*
      - -usr/lib/*/libglapi*
      - -usr/lib/*/dri/*
      # Host Mesa is newer and calls symbols (e.g. wl_display_create_queue_
      # with_name) absent from the bundled core22 libwayland/libdrm. Drop them
      # too so the whole graphics + display stack comes from the host.
      - -usr/lib/*/libwayland*
      - -usr/lib/*/libdrm*
  wallpaper:
    plugin: dump
    source: assets
    organize:
      wallpaper.jpg: share/graceful-shell/wallpaper.jpg
